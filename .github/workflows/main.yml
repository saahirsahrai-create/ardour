name: Build Ardour (stable-9.8)

on:
  push:
    branches: [ "stable-9.8" ]
  pull_request:
    branches: [ "stable-9.8" ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-full-build:
    name: Build Ardour on Windows x64 via MSYS2
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
      MINGW_PREFIX: /mingw64
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true   # ✅ FIX 1: Tag issue solve

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          cache: true
          msystem: MINGW64
          install: >-
            base-devel
            git
            zip
            unzip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-glibmm
            mingw-w64-x86_64-cairomm
            mingw-w64-x86_64-pangomm
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-liblo
            mingw-w64-x86_64-fluidsynth
            mingw-w64-x86_64-taglib
            mingw-w64-x86_64-rubberband
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-aubio
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-lv2
            mingw-w64-x86_64-lilv
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-fontconfig
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-jack2
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-ntldd

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-x64-${{ github.ref_name }}-${{ hashFiles('wscript', '.github/workflows/ci-ardour-windows-experimental.yml') }}
          restore-keys: |
            ccache-windows-x64-${{ github.ref_name }}-
            ccache-windows-x64-

      - name: Prepare output folders
        run: |
          mkdir -p _ci_logs
          mkdir -p _ci_artifacts

      - name: Fix MSVC headers   # ✅ FIX 2: Missing headers solve
        run: |
          set -euxo pipefail
          cd msvc_extra_headers/ardourext
          for f in *.input; do
            [ -f "$f" ] && mv "$f" "${f%.input}"
          done
          ls -la

      - name: Show toolchain versions
        run: |
          set -euxo pipefail
          mkdir -p "$CCACHE_DIR"
          export PATH="$MINGW_PREFIX/bin:/usr/bin:$PATH"
          which python3 | tee _ci_logs/python-which.log
          python3 --version 2>&1 | tee _ci_logs/python.log
          python3 -c 'import shutil; print(shutil.which("gcc"))' | tee _ci_logs/python-gcc-which.log
          python3 -c 'import shutil; print(shutil.which("g++"))' | tee _ci_logs/python-gxx-which.log
          gcc --version 2>&1 | tee _ci_logs/gcc.log
          which gcc | tee _ci_logs/gcc-which.log
          pkg-config --version 2>&1 | tee _ci_logs/pkg-config.log
          ccache -p | tee _ci_logs/ccache-config.log

      - name: Configure Ardour
        run: |
          set -euxo pipefail
          export PATH="$MINGW_PREFIX/bin:/usr/bin:$PATH"
          export PKG_CONFIG_PATH="$MINGW_PREFIX/lib/pkgconfig"
          python3 ./waf configure \
            --check-c-compiler=gcc \
            --check-cxx-compiler=g++ \
            --no-dr-mingw \
            --keepflags \
            --dist-target=mingw \
            --also-include="$MINGW_PREFIX/include" \
            --with-backends=jack,dummy,portaudio \
            --prefix="$PWD/_ci_install" \
            --libdir="$PWD/_ci_install/lib" 2>&1 | tee _ci_logs/configure.log || {
              if [[ -f build/config.log ]]; then
                cp build/config.log _ci_logs/config.full.log
                tail -n 200 build/config.log | tee -a _ci_logs/configure.log
              fi
              exit 1
            }

      - name: Build Ardour
        run: |
          set -euxo pipefail
          export PATH="$MINGW_PREFIX/bin:/usr/bin:$PATH"
          python3 ./waf -j "${{ inputs.jobs || '2' }}" 2>&1 | tee _ci_logs/build.log
          python3 ./waf i18n 2>&1 | tee _ci_logs/i18n.log

      - name: Show ccache stats
        if: always()
        run: |
          set -euxo pipefail
          ccache -s || true

      - name: Install Ardour data files
        run: |
          set -euxo pipefail
          export PATH="$MINGW_PREFIX/bin:/usr/bin:$PATH"
          python3 ./waf install 2>&1 | tee _ci_logs/install.log

      - name: Package Ardour (DLLs + NSIS installer)
        run: |
          set -euxo pipefail
          export PATH="$MINGW_PREFIX/bin:/usr/bin:$PATH"
          export WAFINSTALL_PREFIX="$PWD/_ci_install"
          export OUTDIR="$PWD/_ci_artifacts"
          bash tools/x-win/package-msys2.sh 2>&1 | tee _ci_logs/package.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows-logs
          path: _ci_logs/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Ardour installer
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows-x64-installer
          path: _ci_artifacts/Ardour-*-windows-x64-Setup.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Ardour binaries (fallback zip if no installer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows-x64
          path: _ci_artifacts/Ardour-*-windows-x64.zip
          if-no-files-found: ignore
          retention-days: 14
