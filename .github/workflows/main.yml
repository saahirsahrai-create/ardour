name: Build Ardour (stable-9.8)

on:
  push:
    branches: [ "stable-9.8" ]
  pull_request:
    branches: [ "stable-9.8" ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-full-build:
    name: Build Ardour on Windows x64 via MSYS2
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
      MINGW_PREFIX: /mingw64
    defaults:
      run:
        shell: msys2 {0}

    steps:
      # ... [earlier steps remain the same] ...

      # ===============================================================
      # FIX 4: char8_t string conversion (C++20 UTF-8 literals)
      # GCC 16.2.0 is stricter about char8_t (u8"...") conversions to
      # std::string(const char*). Convert u8"..." -> "..." for compatibility.
      # ===============================================================
      - name: Fix char8_t string conversions
        run: |
          set -euxo pipefail
          echo "=== Searching for u8 string literals ==="
          find . -type f \( -name "*.cc" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) 2>/dev/null | while read file; do
            if grep -q 'u8"' "$file" 2>/dev/null; then
              echo "Fixing u8 strings in: $file"
              sed -i 's/u8"/"/g' "$file"
            fi
          done
          echo "=== char8_t string conversion complete ==="

      - name: Show toolchain versions
        run: |
          # ... rest of workflow continues ...
