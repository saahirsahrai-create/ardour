```yaml
name: Build Ardour (stable-9.8)

on:
  push:
    branches: [ "stable-9.8" ]
  pull_request:
    branches: [ "stable-9.8" ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-full-build:
    name: Build Ardour on Windows x64 via MSYS2
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
      MINGW_PREFIX: /mingw64

    defaults:
      run:
        shell: msys2 {0}

    steps:

      # ===============================================================
      # CHECKOUT
      # ===============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===============================================================
      # SETUP MSYS2
      # ===============================================================
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          cache: true
          msystem: MINGW64
          install: >-
            base-devel
            git
            zip
            unzip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-glibmm
            mingw-w64-x86_64-cairomm
            mingw-w64-x86_64-pangomm
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-liblo
            mingw-w64-x86_64-fluidsynth
            mingw-w64-x86_64-taglib
            mingw-w64-x86_64-rubberband
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-aubio
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-lv2
            mingw-w64-x86_64-lilv
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-fontconfig
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-jack2
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-ntldd

      # ===============================================================
      # CCACHE
      # ===============================================================
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-x64-${{ github.ref_name }}-${{ hashFiles('wscript') }}
          restore-keys: |
            ccache-windows-x64-${{ github.ref_name }}-
            ccache-windows-x64-

      # ===============================================================
      # OUTPUT DIRECTORIES
      # ===============================================================
      - name: Prepare output folders
        run: |
          set -euxo pipefail
          mkdir -p _ci_logs
          mkdir -p _ci_artifacts

      # ===============================================================
      # FIX 1: FORK TAGS
      # ===============================================================
      - name: Fix git tags for fork
        run: |
          set -euxo pipefail

          git remote add upstream https://github.com/Ardour/ardour.git 2>/dev/null || true

          git fetch upstream --tags --force 2>&1 || \
            echo "Upstream fetch failed, will create temp tag"

          echo "=== Tags after upstream fetch ==="
          git tag -l | head -30

          if [ -z "$(git tag -l)" ]; then
            echo "WARNING: No tags found. Creating temporary tag v9.8"
            git tag -a v9.8 -m "Temporary tag for CI build" HEAD
          fi

          echo "=== Final git describe ==="
          git describe --tags --always

      # ===============================================================
      # FIX 2: POSIX HEADERS
      # ===============================================================
      - name: Fix MSVC/POSIX headers
        run: |
          set -euxo pipefail

          cd msvc_extra_headers/ardourext

          for f in *.input; do
            [ -f "$f" ] && mv "$f" "${f%.input}"
          done

          mkdir -p sys

          if [ ! -f sys/vfs.h ]; then
            echo "Creating empty sys/vfs.h"
            touch sys/vfs.h
          fi

          echo "=== Headers after fix ==="
          ls -la

          echo "=== sys/ contents ==="
          ls -la sys/

      # ===============================================================
      # FIX 3: wchar_t -> narrow string
      # ===============================================================
      - name: Fix wchar_t-into-string_compose
        run: |
          set -euxo pipefail

          FILE="libs/pbd/file_utils.cc"

          sed -i \
            's/string_compose ("PBD::canonical_path: Unable to resolve %1\\n", wfilepath)/string_compose ("PBD::canonical_path: Unable to resolve %1\\n", path)/' \
            "$FILE"

          sed -i \
            's/resolved_wpath));$/path));/' \
            "$FILE"

          echo "=== Patched lines ==="
          grep -n \
            "Unable to resolve %1\|Unable to convert path from utf16" \
            -A1 \
            "$FILE" || true

      # ===============================================================
      # FIX 4: GCC 16 char8_t / std::string incompatibility
      #
      # Error:
      #
      # libs/ardour/engine_slave.cc:126:24
      # return string (u8"\u0394     0  ");
      #
      # GCC 16 treats u8"..." as const char8_t[].
      # std::string expects const char*.
      #
      # Use explicit UTF-8 bytes instead:
      #
      # "\xCE\x94     0  "
      #
      # CE 94 = UTF-8 encoding of Greek capital Delta (Δ)
      # ===============================================================
      - name: Fix GCC 16 char8_t engine_slave
        run: |
          set -euxo pipefail

          FILE="libs/ardour/engine_slave.cc"

          echo "=== Before patch ==="
          grep -n -F 'return string (u8"\u0394' "$FILE" || true

          python3 - <<'PY'
          from pathlib import Path

          file = Path("libs/ardour/engine_slave.cc")
          text = file.read_text(encoding="utf-8")

          old = r'''return string (u8"\u0394     0  ");'''
          new = r'''return string ("\xCE\x94     0  ");'''

          if old not in text:
              raise SystemExit(
                  "Expected GCC 16 char8_t line was not found. "
                  "Source may have changed."
              )

          text = text.replace(old, new, 1)
          file.write_text(text, encoding="utf-8")

          print("engine_slave.cc patched successfully")
          PY

          echo "=== After patch ==="
          grep -n -F 'return string ("\xCE\x94' "$FILE"

      # ===============================================================
      # VERIFY SOURCE PATCHES
      # ===============================================================
      - name: Verify source fixes
        run: |
          set -euxo pipefail

          echo "=== engine_slave.cc ==="
          grep -n -F 'return string ("\xCE\x94' \
            libs/ardour/engine_slave.cc

          echo "=== file_utils.cc ==="
          grep -n \
            "Unable to resolve %1\|Unable to convert path from utf16" \
            -A1 \
            libs/pbd/file_utils.cc || true

      # ===============================================================
      # TOOLCHAIN INFO
      # ===============================================================
      - name: Show toolchain versions
        run: |
          set -euxo pipefail

          mkdir -p "$CCACHE_DIR"

          export PATH="$MINGW_PREFIX/bin:/usr/bin:$PATH"

          echo "=== Python ==="
          which python3
          python3 --version 2>&1 | tee _ci_logs/python.log

          echo "=== GCC ==="
          which gcc
          gcc --version 2>&1 | tee _ci_logs/gcc.log

          echo "=== G++ ==="
          which g++
          g++ --version 2>&1 | tee _ci_logs/g++.log

          echo "=== pkg-config ==="
          pkg-config --version 2>&1 | tee _ci_logs/pkg-config.log

          echo "=== ccache ==="
          ccache -p | tee _ci_logs/ccache-config.log

      # ===============================================================
      # CONFIGURE
      # ===============================================================
      - name: Configure Ardour
        run: |
          set -euxo pipefail

          export PATH="$MINGW_PREFIX/bin:/usr/bin:$PATH"
          export PKG_CONFIG_PATH="$MINGW_PREFIX/lib/pkgconfig"

          python3 ./waf configure \
            --check-c-compiler=gcc \
            --check-cxx-compiler=g++ \
            --no-dr-mingw \
            --keepflags \
            --dist-target=mingw \
            --also-include="$MINGW_PREFIX/include" \
            --with-backends=jack,dummy,portaudio \
            --prefix="$PWD/_ci_install" \
            --libdir="$PWD/_ci_install/lib" \
            2>&1 | tee _ci_logs/configure.log

          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            echo "=== CONFIGURE FAILED ==="

            if [ -f build/config.log ]; then
              cp build/config.log _ci_logs/config.full.log
```
