name: Build Ardour (stable-9.8)

on:
  push:
    branches: [ "stable-9.8" ]
  pull_request:
    branches: [ "stable-9.8" ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-full-build:
    name: Build Ardour on Windows x64 via MSYS2
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
      MINGW_PREFIX: /mingw64
    defaults:
      run:
        shell: msys2 {0}

    steps:
      # ===============================================================
      # CRITICAL FIX: Setup MSYS2 FIRST
      # The error "msys2: command not found" occurs because the msys2
      # shell is being used before MSYS2 is installed. This action MUST
      # be the first step that runs BEFORE any msys2 {0} shell commands.
      # ===============================================================
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            base-devel
            git
            zip
            unzip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-glibmm
            mingw-w64-x86_64-cairomm
            mingw-w64-x86_64-pango
            mingw-w64-x86_64-pangomm
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libxslt
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-liblo
            mingw-w64-x86_64-aubio
            mingw-w64-x86_64-portaudio
          path-type: minimal
          release: true
          platform-check-severity: fatal

      - name: Checkout code
        uses: actions/checkout@v4

      # ===============================================================
      # FIX: char8_t string conversion (C++20 UTF-8 literals)
      # GCC 16.2.0 is stricter about char8_t (u8"...") conversions to
      # std::string(const char*). Convert u8"..." -> "..." for compatibility.
      # ===============================================================
      - name: Fix char8_t string conversions
        run: |
          set -euxo pipefail
          echo "=== Searching for u8 string literals ==="
          find . -type f \( -name "*.cc" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) 2>/dev/null | while read file; do
            if grep -q 'u8"' "$file" 2>/dev/null; then
              echo "Fixing u8 strings in: $file"
              sed -i 's/u8"/"/g' "$file"
            fi
          done
          echo "=== char8_t string conversion complete ==="

      - name: Show toolchain versions
        run: |
          gcc --version
          g++ --version
          python --version
          pkg-config --version

      - name: Configure build
        run: |
          set -euxo pipefail
          ./waf configure --prefix=/mingw64 || {
            if [[ -f build/config.log ]]; then
              mkdir -p _ci_logs
              cp build/config.log _ci_logs/config.full.log
              tail -n 200 build/config.log | tee -a _ci_logs/configure.log
            fi
            exit 1
          }

      - name: Build Ardour
        run: |
          set -euxo pipefail
          ./waf build || {
            if [[ -f build/config.log ]]; then
              tail -n 200 build/config.log
            fi
            exit 1
          }

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/config.log
            _ci_logs/
          retention-days: 7
